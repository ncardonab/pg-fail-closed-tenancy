# Throwaway Postgres for local runs. No volume: `npm test` rebuilds the
# database from migrations on every run.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 so it never collides with a Postgres already running on 5432.
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 15
